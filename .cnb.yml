# Superagent 插件的 CNB 云原生构建流水线
#
# - main 分支推送、目标为 main 的 PR:安装依赖 → 类型检查 → 测试
# - 推送 v* Tag(如 v0.2.0):校验 Tag 与 package.json 版本一致 → 类型检查与测试 →
#   打包并发布 @0_0/paseo-plugin-superagent 到 CNB npm 制品库 →
#   创建同名 Release
#
# 发布使用构建内置的 CNB_TOKEN(tag_push 属于可信事件,令牌带制品库读写权限),无需密钥仓库;
# 推送 Tag 的人需要是该 npm 制品库的「开发者」或以上角色。发版步骤见 docs/development.md。

.node: &node
  docker:
    image: node:24
    volumes:
      - /root/.npm

.checks: &checks
  - name: install
    script: npm ci --ignore-scripts --no-audit --no-fund
  - name: typecheck
    script: npm run typecheck
  - name: test
    script: npm test

main:
  push:
    - name: check
      <<: *node
      stages: *checks
  pull_request:
    - name: check
      <<: *node
      stages: *checks

"v*":
  tag_push:
    - name: publish
      <<: *node
      env:
        NPM_REGISTRY: https://npm.cnb.cool/0_0/paseo/superagent-plugin/-/packages/
      stages:
        - name: verify version
          script: |
            VERSION="v$(node -p "require('./package.json').version")"
            if [ "$VERSION" != "$CNB_BRANCH" ]; then
              echo "Tag $CNB_BRANCH does not match package.json version $VERSION; bump package.json first" >&2
              exit 1
            fi
        - name: install
          script: npm ci --ignore-scripts --no-audit --no-fund
        - name: typecheck
          script: npm run typecheck
        - name: test
          script: npm test
        - name: prepare package
          script: |
            # npm 来源安装时 Paseo 已用 npm 装好生产依赖;manifest 的 build(npm ci)只给 Git/目录安装用,
            # 发布到 npm 的副本去掉它,避免在包目录里再装一遍。
            node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("paseo-plugin.json","utf8"));delete m.build;fs.writeFileSync("paseo-plugin.json",JSON.stringify(m,null,2)+"\n")'
            # 不随包发布锁文件:npm 12 起既不打包也不读取依赖包里的 npm-shrinkwrap.json;
            # 用户安装时的直接依赖由 package.json 里精确钉死的版本保证。
            npm pack --dry-run --ignore-scripts
        - name: publish
          script: |
            npm config set "//${NPM_REGISTRY#https://}:_authToken" "$CNB_TOKEN"
            case "$CNB_BRANCH" in
              *-*) npm publish --registry "$NPM_REGISTRY" --ignore-scripts --tag next ;;
              *) npm publish --registry "$NPM_REGISTRY" --ignore-scripts ;;
            esac
        - name: release
          type: git:release
          options:
            title: $CNB_BRANCH
            description: |
              npm: @0_0/paseo-plugin-superagent ($CNB_BRANCH), registry https://npm.cnb.cool/0_0/paseo/superagent-plugin/-/packages/

              Installation and upgrade notes: see README.md (中文) / README-EN.md (English).
