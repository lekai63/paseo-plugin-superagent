# Superagent 插件的 CNB 云原生构建流水线
#
# - main 分支推送、目标为 main 的 PR:安装依赖 → 类型检查 → 测试
# - 推送 v* Tag(如 v0.2.0):校验 Tag 与 package.json 版本一致 → 类型检查与测试 →
#   检查打包内容 → 创建同名 Release
#
# 不再向 CNB npm 制品库发布。插件来源是 GitHub 仓库(git:)与 Paseo 官方插件目录;
# 发版步骤见 docs/development.md。

.node: &node
  docker:
    image: node:24
    volumes:
      - /root/.npm

.checks: &checks
  - name: install
    script: npm ci --ignore-scripts --no-audit --no-fund
  - name: typecheck
    script: npm run typecheck
  - name: test
    script: npm test

main:
  push:
    - name: check
      <<: *node
      stages: *checks
  pull_request:
    - name: check
      <<: *node
      stages: *checks

"v*":
  tag_push:
    - name: release
      <<: *node
      stages:
        - name: verify version
          script: |
            VERSION="v$(node -p "require('./package.json').version")"
            if [ "$VERSION" != "$CNB_BRANCH" ]; then
              echo "Tag $CNB_BRANCH does not match package.json version $VERSION; bump package.json first" >&2
              exit 1
            fi
        - name: install
          script: npm ci --ignore-scripts --no-audit --no-fund
        - name: typecheck
          script: npm run typecheck
        - name: test
          script: npm test
        - name: check package
          script: npm pack --dry-run --ignore-scripts
        - name: release
          type: git:release
          options:
            title: $CNB_BRANCH
            description: |
              Install from the Git repository, pinned to this tag:

              paseo plugin install git:https://github.com/lekai63/paseo-plugin-superagent.git --ref $CNB_BRANCH

              Installation and upgrade notes: see README.md (English) / README-CN.md (中文).
